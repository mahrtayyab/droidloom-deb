# Client-side title bars for the pinned, matching Droidloom runtime.
# The packaged presenter is not replaced. Review/rebuild after package updates.
[Service]
ExecCondition=/usr/bin/sha256sum --status --check %h/.local/lib/droidloom-titlebar/packaged-presenter.sha256
ExecStart=
ExecStart=%h/.local/lib/droidloom-titlebar/droidloom-wayland
